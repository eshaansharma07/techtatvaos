<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Signature</title>
</head>
<body style="margin: 0; padding: 20px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f9f9f9;">

  <!-- Outer container for previewing/copying -->
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
    
    <div style="font-size: 13px; color: #64748b; margin-bottom: 20px; font-family: sans-serif; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px;">
      <strong>HTML Email Signature Preview:</strong> (Select and copy the signature below to paste into Gmail, Outlook, or Apple Mail settings)
    </div>

    <!-- START SIGNATURE -->
    <table cellpadding="0" cellspacing="0" border="0" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b; line-height: 1.5; font-size: 14px; max-width: 500px; border-collapse: collapse;">
      <tr>
        <td style="padding-bottom: 20px;">
          <!-- Top Logos (CU Logo, Tech Tatva Logo, Event Logo) -->
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
            <tr>
              <!-- CU Logo -->
              <td valign="middle" style="padding-right: 18px;">
                <a href="https://techtatva.in" target="_blank" style="text-decoration: none; border: 0;">
                  <img src="https://techtatva.in/email/cu-logo.png" alt="Chandigarh University" height="40" style="display: block; height: 40px; border: 0; object-fit: contain;" />
                </a>
              </td>
              <!-- Vertical Divider -->
              <td valign="middle" style="width: 1px; border-left: 1px solid #e2e8f0; padding-right: 18px;"></td>
              <!-- Tech Tatva Logo -->
              <td valign="middle" style="padding-right: 18px;">
                <a href="https://techtatva.in" target="_blank" style="text-decoration: none; border: 0;">
                  <img src="https://techtatva.in/email/techtatva-logo.png" alt="Tech Tatva" height="40" style="display: block; height: 40px; border: 0; object-fit: contain;" />
                </a>
              </td>
              <!-- Vertical Divider -->
              <td valign="middle" style="width: 1px; border-left: 1px solid #e2e8f0; padding-right: 18px;"></td>
              <!-- Event Logo -->
              <td valign="middle">
                <a href="https://techtatva.in" target="_blank" style="text-decoration: none; border: 0;">
                  <img src="https://techtatva.in/email/event-logo.png" alt="Event Logo" height="40" style="display: block; height: 40px; border: 0; object-fit: contain;" />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="border-top: 1px solid #e2e8f0; padding-top: 20px; padding-bottom: 20px;">
          <!-- Signature Details -->
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; width: 100%;">
            <tr>
              <td>
                <span style="font-size: 18px; font-weight: 700; color: #0f172a; display: block; margin: 0; letter-spacing: -0.02em;">Eshaan Sharma</span>
                <span style="font-size: 13px; font-weight: 600; color: #c39e52; display: block; margin: 2px 0 10px 0; text-transform: uppercase; letter-spacing: 0.05em;">Secretary | Tech Tatva</span>
                
                <span style="font-size: 12px; color: #475569; display: block; margin: 0; line-height: 1.4;">Department of Computer Science Engineering (AI & ML)</span>
                <span style="font-size: 12px; color: #475569; display: block; margin: 0 0 16px 0; line-height: 1.4; font-weight: 500;">Chandigarh University</span>
                
                <!-- Contact Information Table -->
                <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-size: 12.5px;">
                  <tr>
                    <td valign="middle" style="padding-right: 6px; padding-bottom: 4px;">
                      <span style="font-size: 14px; line-height: 1; display: inline-block;">📧</span>
                    </td>
                    <td valign="middle" style="padding-bottom: 4px;">
                      <a href="mailto:secretary@techtatva.in" style="color: #0f172a; text-decoration: none; font-weight: 500;">secretary@techtatva.in</a>
                    </td>
                  </tr>
                  <tr>
                    <td valign="middle" style="padding-right: 6px;">
                      <span style="font-size: 14px; line-height: 1; display: inline-block;">🌐</span>
                    </td>
                    <td valign="middle">
                      <a href="https://techtatva.in" target="_blank" style="color: #0f172a; text-decoration: none; font-weight: 500;">techtatva.in</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="border-top: 1px solid #f1f5f9; padding-top: 16px;">
          <!-- Social Icons Table -->
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
            <tr>
              <!-- Instagram -->
              <td valign="middle" style="padding-right: 14px;">
                <a href="https://instagram.com/" target="_blank" style="text-decoration: none; border: 0; display: inline-block; line-height: 0;">
                  <img src="https://techtatva.in/email/instagram.png" alt="Instagram" width="20" height="20" style="display: block; width: 20px; height: 20px; border: 0;" />
                </a>
              </td>
              <!-- LinkedIn -->
              <td valign="middle" style="padding-right: 14px;">
                <a href="https://linkedin.com/" target="_blank" style="text-decoration: none; border: 0; display: inline-block; line-height: 0;">
                  <img src="https://techtatva.in/email/linkedin.png" alt="LinkedIn" width="20" height="20" style="display: block; width: 20px; height: 20px; border: 0;" />
                </a>
              </td>
              <!-- YouTube -->
              <td valign="middle">
                <a href="https://youtube.com/" target="_blank" style="text-decoration: none; border: 0; display: inline-block; line-height: 0;">
                  <img src="https://techtatva.in/email/youtube.png" alt="YouTube" width="20" height="20" style="display: block; width: 20px; height: 20px; border: 0;" />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <!-- END SIGNATURE -->

  </div>

</body>
</html>
