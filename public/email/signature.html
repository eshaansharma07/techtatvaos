<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Signature Preview</title>
</head>
<body style="margin: 0; padding: 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc;">

  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);">
    
    <div style="font-size: 13px; color: #64748b; margin-bottom: 24px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px; line-height: 1.5;">
      <strong>HTML Email Signature Preview:</strong><br>
      Highlight, copy, and paste the signature below directly into your Gmail, Outlook, or Apple Mail signature settings.
    </div>

    <!-- START SIGNATURE -->
    <table cellpadding="0" cellspacing="0" border="0" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b; line-height: 1.5; font-size: 14px; max-width: 500px; border-collapse: collapse;">
      <tr>
        <td style="padding-bottom: 24px;">
          <!-- Top Logos (CU Logo, Tech Tatva Logo, Current Event Logo) -->
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
            <tr>
              <!-- CU Logo -->
              <td valign="middle" style="padding-right: 18px;">
                <a href="https://www.cuchd.in" target="_blank" style="text-decoration: none; border: 0;">
                  <img src="https://techtatva.in/email/cu-logo.png" alt="Chandigarh University" height="50" style="display: block; height: 50px; border: 0; object-fit: contain;" />
                </a>
              </td>
              <!-- Vertical Divider -->
              <td valign="middle" style="width: 1px; border-left: 1px solid #e2e8f0; padding-right: 18px;"></td>
              <!-- Tech Tatva Logo -->
              <td valign="middle" style="padding-right: 18px;">
                <a href="https://techtatva.in" target="_blank" style="text-decoration: none; border: 0;">
                  <img src="https://techtatva.in/email/techtatva-logo.png" alt="Tech Tatva" height="50" style="display: block; height: 50px; border: 0; object-fit: contain;" />
                </a>
              </td>
              <!-- Vertical Divider -->
              <td valign="middle" style="width: 1px; border-left: 1px solid #e2e8f0; padding-right: 18px;"></td>
              <!-- Current Event Logo -->
              <td valign="middle">
                <a href="https://techtatva.in" target="_blank" style="text-decoration: none; border: 0;">
                  <img src="https://techtatva.in/email/current-event.png" alt="Current Event" height="50" style="display: block; height: 50px; border: 0; object-fit: contain;" />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="border-top: 1px solid #e2e8f0; padding-top: 20px; padding-bottom: 20px;">
          <!-- Signature Details -->
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; width: 100%;">
            <tr>
              <td>
                <span style="font-size: 20px; font-weight: 700; color: #0f172a; display: block; margin: 0 0 2px 0; letter-spacing: -0.02em;">Eshaan Sharma</span>
                <span style="font-size: 14px; font-weight: 700; color: #0f172a; display: block; margin: 0;">Secretary</span>
                <span style="font-size: 14px; font-weight: 700; color: #8b5cf6; display: block; margin: 0 0 12px 0;">Tech Tatva</span>
                
                <span style="font-size: 12px; color: #64748b; display: block; margin: 0; line-height: 1.45;">Department of Computer Science Engineering (AI & ML)</span>
                <span style="font-size: 12px; color: #64748b; display: block; margin: 0 0 18px 0; line-height: 1.45; font-weight: 500;">Chandigarh University</span>
                
                <!-- Contact Details -->
                <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-size: 12.5px;">
                  <tr>
                    <td valign="middle" style="padding-right: 8px; padding-bottom: 5px; line-height: 0;">
                      <img src="https://techtatva.in/email/email.png" alt="Email" width="14" height="14" style="display: block; width: 14px; height: 14px; border: 0;" />
                    </td>
                    <td valign="middle" style="padding-bottom: 5px;">
                      <a href="mailto:secretary@techtatva.in" style="color: #0f172a; text-decoration: none; font-weight: 500;">secretary@techtatva.in</a>
                    </td>
                  </tr>
                  <tr>
                    <td valign="middle" style="padding-right: 8px; line-height: 0;">
                      <img src="https://techtatva.in/email/website.png" alt="Website" width="14" height="14" style="display: block; width: 14px; height: 14px; border: 0;" />
                    </td>
                    <td valign="middle">
                      <a href="https://techtatva.in" target="_blank" style="color: #0f172a; text-decoration: none; font-weight: 500;">techtatva.in</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="border-top: 1px solid #f1f5f9; padding-top: 16px;">
          <!-- Social Icons Table -->
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
            <tr>
              <!-- Instagram -->
              <td valign="middle" style="padding-right: 14px;">
                <a href="https://instagram.com/techtatvaclub" target="_blank" style="text-decoration: none; border: 0; display: inline-block; line-height: 0;">
                  <img src="https://techtatva.in/email/instagram.png" alt="Instagram" width="20" height="20" style="display: block; width: 20px; height: 20px; border: 0;" />
                </a>
              </td>
              <!-- LinkedIn -->
              <td valign="middle">
                <a href="https://www.linkedin.com/company/techtatvaclub" target="_blank" style="text-decoration: none; border: 0; display: inline-block; line-height: 0;">
                  <img src="https://techtatva.in/email/linkedin.png" alt="LinkedIn" width="20" height="20" style="display: block; width: 20px; height: 20px; border: 0;" />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <!-- END SIGNATURE -->

  </div>

</body>
</html>
